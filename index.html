<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #FDF6ED;
    --warm-white: #FFFBF5;
    --brown-dark: #3B2314;
    --brown-mid: #7A4528;
    --brown-light: #C8895A;
    --brown-pale: #EDD9C4;
    --green-sage: #6B8C6E;
    --green-pale: #DCE9DC;
    --accent-orange: #E8703A;
    --accent-yellow: #F5C842;
    --text-main: #2A1A0E;
    --text-muted: #7A5C45;
    --radius: 20px;
    --radius-lg: 32px;
  }

  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
  }

  /* HERO */
  .hero {
    position: relative;
    height: 420px;
    overflow: hidden;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(43,26,14,0.75) 100%);
  }

  .hero-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--accent-yellow);
    color: var(--brown-dark);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 99px;
  }

  .paw-top {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 26px;
    opacity: 0.9;
  }

  .hero-info {
    position: absolute;
    bottom: 28px;
    left: 24px;
    right: 24px;
  }

  .hero-name {
    font-family: 'Fraunces', serif;
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    letter-spacing: -1px;
  }

  .hero-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.82);
    margin-top: 6px;
    font-weight: 300;
  }

  .hero-chips {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .chip {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 99px;
  }

  /* CONTENT */
  .content {
    padding: 0 16px 100px;
    margin-top: -20px;
    position: relative;
    z-index: 2;
  }

  /* STATS STRIP */
  .stats-strip {
    background: var(--warm-white);
    border-radius: var(--radius-lg);
    padding: 20px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    box-shadow: 0 4px 24px rgba(59,35,20,0.1);
    margin-bottom: 16px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
  }

  .stat-item + .stat-item {
    border-left: 1px solid var(--brown-pale);
  }

  .stat-val {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--brown-dark);
    line-height: 1;
  }

  .stat-unit {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* CARDS */
  .card {
    background: var(--warm-white);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    box-shadow: 0 2px 12px rgba(59,35,20,0.06);
  }

  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title-icon {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  /* FOOD CARD */
  .food-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .food-item {
    background: var(--green-pale);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .food-item-icon { font-size: 22px; }
  .food-item-name { font-size: 14px; font-weight: 600; color: var(--brown-dark); }
  .food-item-detail { font-size: 12px; color: var(--green-sage); }

  /* ALLERGY CARD */
  .allergy-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .allergy-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FFF0EC;
    border-radius: 12px;
    padding: 12px 14px;
    border-left: 3px solid var(--accent-orange);
  }

  .allergy-icon { font-size: 18px; }
  .allergy-text { font-size: 14px; font-weight: 500; color: var(--brown-dark); }
  .allergy-sub { font-size: 12px; color: var(--text-muted); }

  /* LOCATION */
  .location-map {
    border-radius: 16px;
    overflow: hidden;
    height: 160px;
    position: relative;
  }

  .location-map iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .location-address {
    margin-top: 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .location-icon {
    width: 36px;
    height: 36px;
    min-width: 36px;
    background: var(--brown-pale);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .location-text strong { font-size: 14px; font-weight: 600; display: block; }
  .location-text span { font-size: 13px; color: var(--text-muted); }

  /* VET / INFO ROW */
  .info-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .info-mini {
    background: var(--warm-white);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 2px 12px rgba(59,35,20,0.06);
  }

  .info-mini-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .info-mini-val {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--brown-dark);
  }

  .info-mini-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* PHOTO GALLERY */
  .gallery {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 8px;
    height: 200px;
  }

  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
  }

  .gallery-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
  }

  .gallery-col img {
    flex: 1;
    min-height: 0;
  }

  /* WHATSAPP BTN - flotante fijo en la parte inferior */
  .btn-whatsapp-wrapper {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    padding: 12px 16px 20px;
    background: linear-gradient(to top, var(--cream) 70%, transparent);
    z-index: 100;
    pointer-events: none;
  }

  .btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 99px;
    padding: 17px 24px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 4px 24px rgba(37,211,102,0.45);
    width: 100%;
    pointer-events: all;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn-whatsapp:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(37,211,102,0.3);
  }

  .btn-whatsapp svg {
    width: 22px;
    height: 22px;
    fill: #fff;
  }

  /* VACCINE TIMELINE */
  .vaccine-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .vaccine-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 16px;
    position: relative;
  }

  .vaccine-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 14px;
    top: 28px;
    bottom: 0;
    width: 1px;
    background: var(--brown-pale);
  }

  .vaccine-dot {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    position: relative;
    z-index: 1;
  }

  .vaccine-dot.done { background: var(--green-pale); }
  .vaccine-dot.pending { background: #FFF0EC; }

  .vaccine-name { font-size: 14px; font-weight: 600; color: var(--brown-dark); }
  .vaccine-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .vaccine-status {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
  }

  .vaccine-status.done { background: var(--green-pale); color: var(--green-sage); }
  .vaccine-status.pending { background: #FFF0EC; color: var(--accent-orange); }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .footer span { font-family: 'Fraunces', serif; font-style: italic; }

  /* DIVIDER */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    padding: 8px 4px 10px;
  }
</style>
</head>
<body>

<!-- Elementos que se rellenan con JS -->
<div class="hero">
  <img class="hero-img" id="hero-img" src="" alt="">
  <div class="hero-overlay"></div>
  <div class="paw-top">🐾</div>
  <div class="hero-badge" id="hero-badge"></div>
  <div class="hero-info">
    <div class="hero-name" id="hero-name"></div>
    <div class="hero-sub" id="hero-sub"></div>
    <div class="hero-chips" id="hero-chips"></div>
  </div>
</div>

<div class="content">

  <div class="stats-strip" id="stats-strip"></div>

  <div class="info-row" style="margin-bottom:12px">
    <div class="info-mini">
      <div class="info-mini-label">🏥 Veterinario</div>
      <div class="info-mini-val" id="vet-nombre"></div>
      <div class="info-mini-sub" id="vet-telefono"></div>
    </div>
    <div class="info-mini">
      <div class="info-mini-label">🔖 Microchip</div>
      <div class="info-mini-val" id="chip-numero" style="font-size:13px;letter-spacing:-0.5px"></div>
      <div class="info-mini-sub" id="chip-fecha"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <div class="card-title-icon" style="background:#DCE9DC">🍖</div>
      Alimentación diaria
    </div>
    <div class="food-grid" id="food-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">
      <div class="card-title-icon" style="background:#FFE8E0">⚠️</div>
      Alergias conocidas
    </div>
    <div class="allergy-list" id="allergy-list"></div>
  </div>

  <div class="card">
    <div class="card-title">
      <div class="card-title-icon" style="background:#DCE9DC">💉</div>
      Calendario vacunal
    </div>
    <div class="vaccine-list" id="vaccine-list"></div>
  </div>

  <div class="card">
    <div class="card-title">
      <div class="card-title-icon" style="background:#EDD9C4">📍</div>
      Casa de <span id="loc-name"></span>
    </div>
    <div class="location-map">
      <iframe id="map-iframe" src="" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Ubicación"></iframe>
    </div>
    <div class="location-address">
      <div class="location-icon">🏡</div>
      <div class="location-text">
        <strong id="loc-direccion"></strong>
        <span id="loc-secundaria"></span>
      </div>
    </div>
  </div>

  <div class="card" style="background: #FFF8EC; border: 1px solid #F5E4B8;">
    <div class="card-title" style="margin-bottom:10px">
      <div class="card-title-icon" style="background:#F5E4B8">📝</div>
      Notas especiales
    </div>
    <p id="notas" style="font-size:14px; color:var(--text-main); line-height:1.7"></p>
  </div>

</div>

<div class="footer">
  Hecho con 🐾 para <span id="footer-nombre"></span>
</div>

<div class="btn-whatsapp-wrapper">
  <a class="btn-whatsapp" id="btn-whatsapp" href="#" target="_blank">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    Contactar por WhatsApp
  </a>
</div>

<script>
  const FOOD_ICONS = ['🥣','🥩','🥕','💧','🍗','🦴','🫐','🥚'];
  const ALLERGY_ICONS = ['🌾','🐟','🧅','🥜','🍫','🥛','🍓','⚠️'];

  fetch('perro.json')
    .then(r => r.json())
    .then(d => {
      document.title = d.nombre + ' 🐾';

      // HERO
      document.getElementById('hero-img').src = d.fotoPrincipal;
      document.getElementById('hero-img').alt = d.nombre;
      document.getElementById('hero-badge').textContent = d.chipRegistrado ? '✓ Chip registrado' : 'Sin chip';
      document.getElementById('hero-name').textContent = d.nombre;
      document.getElementById('hero-sub').textContent = d.raza + ' · ' + d.genero;

      const chips = document.getElementById('hero-chips');
      chips.innerHTML = `
        <span class="chip">🎂 ${d.anos} año${d.anos !== 1 ? 's' : ''}</span>
        <span class="chip">📍 ${d.poblacion}</span>
        <span class="chip">⚕️ ${d.estadoSanitario}</span>
      `;

      // STATS
      const genderSymbol = d.genero.toLowerCase().startsWith('m') ? '♂' : '♀';
      document.getElementById('stats-strip').innerHTML = `
        <div class="stat-item">
          <div class="stat-val">${d.peso}<span style="font-size:14px">kg</span></div>
          <div class="stat-label">Peso</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">${d.anos}</div>
          <div class="stat-label">Años</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">${genderSymbol}</div>
          <div class="stat-label">${d.genero}</div>
        </div>
      `;

      // VET & CHIP
      document.getElementById('vet-nombre').innerHTML = d.veterinario.nombre.replace(' ', '<br>');
      document.getElementById('vet-telefono').textContent = '☎ ' + d.veterinario.telefono;
      document.getElementById('chip-numero').innerHTML = d.microchip.codigo;
      document.getElementById('chip-fecha').textContent = 'Registrado ' + d.microchip.fechaRegistro;

      // COMIDA
      const foodGrid = document.getElementById('food-grid');
      foodGrid.innerHTML = d.alimentacion.map((f, i) => `
        <div class="food-item">
          <div class="food-item-icon">${FOOD_ICONS[i % FOOD_ICONS.length]}</div>
          <div class="food-item-name">${f.nombre}</div>
          <div class="food-item-detail">${f.detalle}</div>
        </div>
      `).join('');

      // ALERGIAS
      const allergyList = document.getElementById('allergy-list');
      allergyList.innerHTML = d.alergias.map((a, i) => `
        <div class="allergy-item">
          <div class="allergy-icon">${ALLERGY_ICONS[i % ALLERGY_ICONS.length]}</div>
          <div>
            <div class="allergy-text">${a.nombre}</div>
            <div class="allergy-sub">${a.descripcion}</div>
          </div>
        </div>
      `).join('');

      // VACUNAS
      const vaccineList = document.getElementById('vaccine-list');
      vaccineList.innerHTML = d.vacunas.map(v => `
        <div class="vaccine-item">
          <div class="vaccine-dot ${v.estado}">${v.estado === 'done' ? '✓' : '!'}</div>
          <div style="flex:1">
            <div class="vaccine-name">${v.nombre}</div>
            <div class="vaccine-date">${v.fecha} · próx. ${v.proxima}</div>
          </div>
          <span class="vaccine-status ${v.estado}">${v.estado === 'done' ? 'Al día' : 'Pendiente'}</span>
        </div>
      `).join('');

      // UBICACIÓN
      document.getElementById('loc-name').textContent = d.nombre;
      document.getElementById('map-iframe').src = d.ubicacion.mapsEmbed;
      document.getElementById('loc-direccion').textContent = d.ubicacion.direccion;
      document.getElementById('loc-secundaria').textContent = d.ubicacion.direccionSecundaria;

      // NOTAS
      document.getElementById('notas').textContent = d.notasEspeciales;

      // FOOTER
      document.getElementById('footer-nombre').textContent = d.nombre;

      // WHATSAPP
      const msg = encodeURIComponent(d.whatsapp.mensaje);
      document.getElementById('btn-whatsapp').href = `https://wa.me/${d.whatsapp.telefono}?text=${msg}`;
    })
    .catch(err => console.error('Error cargando perro.json:', err));
</script>

</body>
</html>
